name: Update neofetch card

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neofetch
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: refresh-github-stats

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh neofetch stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-neofetch.mjs

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/neofetch-desktop.svg assets/neofetch-mobile.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "update neofetch stats"
          git pull --rebase origin main
          git push
