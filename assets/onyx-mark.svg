<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" width="520" height="640" role="img" aria-label="Onyx 21 monogram">
  <defs>
    <linearGradient id="om-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset="0.55" stop-color="#090c12"/>
      <stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="om-face1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#0f172a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#020409" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="om-face2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#0b1220" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#020409" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="om-face3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="om-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="om-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95 0 0 0 0 0.95 0 0 0 0 0.95 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="520" height="640" rx="24" fill="url(#om-bg)"/>
  <rect width="520" height="640" rx="24" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="520" height="640" rx="24" filter="url(#om-grain)" opacity="0.4"/>

  <!-- Corner ticks -->
  <g stroke="#334155" stroke-width="1">
    <path d="M28 56 V28 H56" fill="none"/>
    <path d="M492 56 V28 H464" fill="none"/>
    <path d="M28 584 V612 H56" fill="none"/>
    <path d="M492 584 V612 H464" fill="none"/>
  </g>

  <ellipse cx="260" cy="292" rx="210" ry="210" fill="url(#om-halo)"/>

  <!-- Crystal cluster -->
  <g>
    <polygon points="260,92 372,190 332,352 214,300" fill="url(#om-face1)" stroke="#5eead4" stroke-opacity="0.38" stroke-width="1.4"/>
    <polygon points="214,300 332,352 282,474 172,410" fill="url(#om-face2)" stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1.2"/>
    <polygon points="372,190 430,330 332,352" fill="url(#om-face3)" stroke="#e2e8f0" stroke-opacity="0.18" stroke-width="1"/>
    <polyline points="214,300 260,92 372,190" fill="none" stroke="#e2e8f0" stroke-opacity="0.14" stroke-width="0.8"/>
    <polyline points="214,300 332,352 430,330" fill="none" stroke="#5eead4" stroke-opacity="0.14" stroke-width="0.8"/>
  </g>

  <!-- Highlight -->
  <path d="M260 92 L372 190" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.15;0.85;0.15" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Monogram -->
  <g font-family="'Fraunces', Georgia, serif" text-anchor="middle">
    <text x="260" y="548" font-size="86" font-style="italic" fill="#f8fafc" letter-spacing="-1">21</text>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">
    <text x="260" y="582" font-size="12" fill="#5eead4" letter-spacing="8">ONYX</text>
    <text x="260" y="606" font-size="9" fill="#64748b" letter-spacing="3">GREY21ONYX · EST. 2023</text>
  </g>
</svg>
