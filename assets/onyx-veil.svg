<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="GREY21ONYX — web developer banner">
  <defs>
    <!-- Night sky -->
    <radialGradient id="ov-sky" cx="0.42" cy="0.92" r="1.15">
      <stop offset="0" stop-color="#17222b"/>
      <stop offset="0.48" stop-color="#0a0e15"/>
      <stop offset="1" stop-color="#040509"/>
    </radialGradient>

    <!-- Onyx facets -->
    <linearGradient id="ov-facet-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#0f172a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020409" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ov-facet-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#111827" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#020409" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="ov-facet-c" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#1e293b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#020409" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="ov-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ov-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#5eead4" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>

    <!-- Faint engineering grid -->
    <pattern id="ov-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.16"/>
    </pattern>

    <!-- Grain -->
    <filter id="ov-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95
                            0 0 0 0 0.95
                            0 0 0 0 0.95
                            0 0 0 0.06 0"/>
    </filter>

    <!-- Headline glow -->
    <filter id="ov-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="420" fill="url(#ov-sky)"/>
  <rect width="1200" height="420" fill="url(#ov-grid)" opacity="0.55"/>
  <rect width="1200" height="420" filter="url(#ov-grain)" opacity="0.35"/>

  <!-- Stars -->
  <g fill="#e2e8f0">
    <circle cx="72" cy="46" r="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="158" cy="86" r="1"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="246" cy="38" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="104" r="0.9"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="414" cy="62" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="502" cy="34" r="0.8"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="586" cy="92" r="0.9"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="668" cy="52" r="0.7"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="754" cy="112" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1084" cy="48" r="0.8"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="1152" cy="96" r="0.9"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Glow behind the onyx cluster -->
  <ellipse cx="1010" cy="250" rx="280" ry="200" fill="url(#ov-glow)"/>

  <!-- Ghost numeral -->
  <text x="1000" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="300" font-style="italic" fill="none" stroke="#e2e8f0" stroke-opacity="0.05" stroke-width="1.5">21</text>

  <!-- Onyx crystal cluster -->
  <g opacity="0.95">
    <polygon points="978,48 1128,142 1072,304 924,252" fill="url(#ov-facet-a)" stroke="#5eead4" stroke-opacity="0.28" stroke-width="1"/>
    <polygon points="924,252 1072,304 1008,420 866,352" fill="url(#ov-facet-b)" stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1"/>
    <polygon points="1128,142 1186,272 1072,304" fill="url(#ov-facet-c)" stroke="#e2e8f0" stroke-opacity="0.14" stroke-width="1"/>
    <polygon points="978,48 1128,142 1072,304" fill="none" stroke="#5eead4" stroke-opacity="0.14" stroke-width="0.6"/>
    <polygon points="1072,304 1128,142 1186,272" fill="none" stroke="#a78bfa" stroke-opacity="0.14" stroke-width="0.6"/>
    <polygon points="978,48 924,252 1072,304" fill="none" stroke="#e2e8f0" stroke-opacity="0.08" stroke-width="0.6"/>
  </g>

  <!-- Facet shimmer -->
  <g opacity="0.6">
    <path d="M978,48 L1128,142" stroke="#5eead4" stroke-width="1.2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M924,252 L1072,304" stroke="#a78bfa" stroke-width="1" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="7.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Horizon rule -->
  <rect x="80" y="342" width="1040" height="0.7" fill="url(#ov-rule)"/>

  <!-- Wordmark -->
  <g font-family="'Fraunces', 'Playfair Display', Georgia, serif">
    <text x="78" y="316" font-size="94" font-weight="500" font-style="italic" fill="#f8fafc" filter="url(#ov-soft)" letter-spacing="-1.5">GREY<tspan font-family="'JetBrains Mono', ui-monospace, monospace" font-style="normal" font-size="82" fill="#5eead4" letter-spacing="0">21</tspan><tspan fill="#c7d2da">ONYX</tspan></text>
  </g>

  <!-- Tagline -->
  <g font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace">
    <text x="82" y="374" font-size="11" fill="#5eead4" letter-spacing="5.6" opacity="0.95">∗ WEB DEVELOPER · JAVASCRIPT · LARAVEL · REACT ∗</text>
    <text x="1120" y="374" text-anchor="end" font-size="13" font-family="'Fraunces', Georgia, serif" font-style="italic" fill="#94a3b8" opacity="0.75">build · ship · learn</text>
  </g>

  <!-- Editorial corner marks -->
  <g transform="translate(80,40)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" letter-spacing="3">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#94a3b8" stroke-width="0.6"/>
    <text x="20" y="3">VOL.MMXXVI · ISSUE 01</text>
  </g>
  <g transform="translate(1120,40)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" letter-spacing="3" text-anchor="end">
    <text x="-20" y="3">ONYX / 21</text>
    <line x1="-14" y1="0" x2="0" y2="0" stroke="#94a3b8" stroke-width="0.6"/>
  </g>
</svg>
