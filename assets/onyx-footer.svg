<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Make it useful. Make it clean. Ship it.">
  <defs>
    <linearGradient id="of-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141b"/>
      <stop offset="0.6" stop-color="#080b11"/>
      <stop offset="1" stop-color="#040509"/>
    </linearGradient>
    <linearGradient id="of-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="of-shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#020409" stop-opacity="0"/>
    </linearGradient>
    <filter id="of-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95 0 0 0 0 0.95 0 0 0 0 0.95 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#of-bg)"/>
  <rect width="1200" height="260" rx="18" fill="none" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1200" height="260" rx="18" filter="url(#of-grain)" opacity="0.35"/>

  <polygon points="860,260 1040,30 1140,110 1020,260" fill="url(#of-shard)"/>
  <polygon points="1040,30 1140,110 1020,260" fill="none" stroke="#5eead4" stroke-opacity="0.2" stroke-width="1"/>

  <rect x="72" y="58" width="90" height="0.8" fill="url(#of-line)"/>

  <g font-family="'Fraunces', 'Playfair Display', Georgia, serif">
    <text x="72" y="128" font-size="56" font-style="italic" fill="#f8fafc" letter-spacing="-1">Make it useful.</text>
    <text x="72" y="184" font-size="56" font-style="italic" fill="#5eead4" letter-spacing="-1">Make it clean.</text>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <text x="72" y="222" font-size="10" fill="#94a3b8" letter-spacing="4.5">GREY21ONYX · WEB DEVELOPER</text>
    <text x="1128" y="118" text-anchor="end" font-size="11" fill="#e2e8f0" letter-spacing="5">SHIP IT.</text>
    <text x="1128" y="222" text-anchor="end" font-size="9.5" fill="#64748b" letter-spacing="2">GITHUB.COM/GREY21ONYX</text>
  </g>
</svg>
